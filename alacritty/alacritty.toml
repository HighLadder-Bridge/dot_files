[general]
import = [
    "~/.config/alacritty/themes/duskfox.toml"
]
live_config_reload = true

[window] 
padding = { x = 4, y = 2 }
opacity = 0.72
blur = true
startup_mode = "Fullscreen"

[scrolling]
history = 100000
multiplier = 5

[colors.primary]
background = "#282826"

[font]
size = 13.0
offset = { x = 0, y = 4 }
normal = { family = "Hack Nerd Font", style="Regular" }
bold = { family = "Hack Nerd Font", style="Bold" }
italic = { family = "Hack Nerd Font", style="Italic" }
bold_italic = { family = "Hack Nerd Font", style="Bold Italic" }

[terminal]
shell = {program = "/bin/bash", args = ["-l", "-c", "tmux a -t 0 || tmux"]}

